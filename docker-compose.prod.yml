version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kovax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kovax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kovax_password}
      POSTGRES_DB: ${DB_NAME:-kovax_game}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kovax}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kovax-network

  app:
    image: ghcr.io/mrkamura/kovax-game-app:latest
    container_name: kovax-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-kovax}:${DB_PASSWORD:-kovax_password}@postgres:5432/${DB_NAME:-kovax_game}
      NODE_ENV: production
      PORT: 4000
      HOSTNAME: 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - kovax-network

networks:
  kovax-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local