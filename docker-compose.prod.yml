# Использовать когда образ из GitHub Container Registry (ghcr.io)
# На сервере: export IMAGE_APP=ghcr.io/YOUR_GITHUB_USERNAME/kovax-game-app:latest
# docker-compose -f docker-compose.prod.yml up -d
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kovax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kovax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kovax_password}
      POSTGRES_DB: ${DB_NAME:-kovax_game}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kovax}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kovax-network

  app:
    image: ${IMAGE_APP:-kovax-game-app:latest}
    container_name: kovax-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${DB_USER:-kovax}:${DB_PASSWORD:-kovax_password}@postgres:5432/${DB_NAME:-kovax_game}}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${APP_PORT:-4000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - kovax-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  kovax-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
